<!-- 
  CHRISTMAS COUNTDOWN — for Figma Sites "Embed Code" element
  Click anywhere on the overlay box to toggle between two styles:
    Style A: solid deep red box (#752C28), gold text (#998156)
    Style B: original semi-transparent black box, white text
-->

<div id="countdown-wrapper">
  <video id="bg-video" autoplay muted loop playsinline>
    <source src="background.mp4" type="video/mp4">
  </video>
  <div id="custom-bg"></div>
  <input type="file" id="bg-upload-input" accept="image/*,video/*,video/quicktime,.mov" style="display:none">
  <div id="opacity-panel">
    <label for="opacity-slider"><span id="opacity-label-text">Box transparency</span>: <span id="opacity-value">30%</span></label>
    <input type="range" id="opacity-slider" min="0" max="1" step="0.01" value="0.3">
  </div>
  <div id="color-panel">
    <div class="color-row">
      <label for="box-color-swatch">Box colour</label>
      <input type="color" id="box-color-swatch" value="#752C28">
      <input type="text" id="box-color-hex" value="#752C28" maxlength="7" spellcheck="false">
    </div>
    <div class="color-row">
      <label for="text-color-swatch">Text colour</label>
      <input type="color" id="text-color-swatch" value="#998156">
      <input type="text" id="text-color-hex" value="#998156" maxlength="7" spellcheck="false">
    </div>
  </div>
  <div id="video-controls-panel">
    <label for="video-speed-slider">Speed: <span id="video-speed-value">1x</span></label>
    <input type="range" id="video-speed-slider" min="0.25" max="2" step="0.25" value="1">
    <button id="video-mute-toggle" type="button">Mute</button>
  </div>
  <div id="overlay" class="style-b">
    <h1 id="headline">Christmas is coming...</h1>
    <div id="countdown">
      <div class="unit"><span id="days">00</span><label>Days</label></div>
      <div class="unit"><span id="hours">00</span><label>Hours</label></div>
      <div class="unit"><span id="minutes">00</span><label>Minutes</label></div>
      <div class="unit"><span id="seconds">00</span><label>Seconds</label></div>
    </div>
  </div>
</div>

<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow-x: hidden;
  }

  /* Added when the mouse has been idle for 1s (see script below). The
     universal selector + !important is needed because #overlay and
     #countdown-wrapper set their own explicit "cursor: pointer" below,
     which would otherwise win over a plain inherited cursor: none. */
  html.cursor-hidden,
  html.cursor-hidden * {
    cursor: none !important;
  }

  #countdown-wrapper {
    position: relative;
    width: 100%;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
    /* Left-clicking the background (outside the countdown box) toggles
       fullscreen; right-clicking it opens a file picker to swap in a
       custom image/gif/video. */
    cursor: pointer;
  }

  #bg-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
  }

  /* Holds a user-uploaded background (image, gif, or video) in place of
     the built-in video. Hidden by default — only shown after an upload,
     and never persisted, so a page reload always reverts to the video
     above. */
  #custom-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
    display: none;
  }

  #custom-bg img,
  #custom-bg video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  #overlay {
    position: relative;
    z-index: 1;
    text-align: center;
    /* Top padding is 36px (not 40px like the other sides) — combined with
       the headline's 36px margin-bottom below, that's a symmetric 36px
       gap above and below the headline, giving a slightly shorter box
       than the very first version while keeping the headline centred
       between the box's top edge and the countdown numbers. */
    padding: 36px 40px 40px 40px;
    border-radius: 24px;
    backdrop-filter: blur(4px);
    cursor: pointer;
    user-select: none;
    transition: background 0.3s ease, color 0.3s ease, opacity 0.3s ease;
    box-sizing: border-box;
    max-width: 90vw;
    margin: 0 auto;
  }

  /* Style A: solid deep red box, gold text. Uses CSS variables (with the
     original colours as fallbacks) so the colour panel below can override
     just these two values without touching anything else. */
  #overlay.style-a {
    background: var(--style-a-bg, #752C28);
    color: var(--style-a-color, #998156);
  }

  #overlay.style-a #headline {
    text-shadow: 0 1px 4px rgba(0,0,0,0.3);
  }

  #overlay.style-a .unit {
    background: var(--style-a-unit-bg, rgba(117, 44, 40, 0.65));
  }

  /* Style B: semi-transparent black box, white text. The tint's alpha is
     a CSS variable (default 0.3, the original value) so the opacity
     slider panel below can adjust just that, live. */
  #overlay.style-b {
    background: rgba(0, 0, 0, var(--style-b-opacity, 0.3));
    color: white;
  }

  #overlay.style-b #headline {
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
  }

  #overlay.style-b .unit {
    background: rgba(255,255,255,0.15);
  }

  /* margin-bottom matches the box's top padding (36px) so the headline
     sits centred between the top edge of the box and the countdown
     numbers below it. */
  #headline {
    font-size: 2.5rem;
    margin: 0 0 36px 0;
  }

  /* On Christmas Day there's no countdown below the headline, so drop
     its margin and even out the box's own top padding back to 40px
     (matching the bottom) — that centres the "Merry Christmas!"
     message in the box, which shrinks back down to fit just that
     message (its original size). */
  #overlay.christmas-day {
    padding-top: 40px;
  }

  #overlay.christmas-day #headline {
    margin-bottom: 0;
  }

  /* Middle-click on the translucent (style-b) box hides it entirely —
     opacity only (not display/visibility), so the box still occupies its
     normal space and can still receive a middle click there to bring it
     back. Pointer events are intentionally left enabled. */
  #overlay.box-hidden {
    opacity: 0;
  }

  #countdown {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .unit {
    border-radius: 16px;
    padding: 20px 28px;
    min-width: 100px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.35);
    transition: background 0.3s ease;
  }

  .unit span {
    display: block;
    font-size: 3rem;
    font-weight: 700;
    line-height: 1;
  }

  .unit label {
    display: block;
    margin-top: 8px;
    font-size: 0.8rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.85;
  }

  @media (max-width: 600px) {
    #overlay { padding: 24px; }
    #headline { font-size: 1.6rem; margin-bottom: 24px; }
    #overlay.christmas-day { padding-top: 24px; }
    #overlay.christmas-day #headline { margin-bottom: 0; }
    .unit { min-width: 70px; padding: 14px 16px; }
    .unit span { font-size: 2rem; }
  }

  /* Floating panel opened by right-clicking the box while it's on the
     translucent (style-b) setting. Positioned at the cursor via JS. */
  #opacity-panel {
    position: fixed;
    z-index: 10;
    display: none;
    background: white;
    color: #222;
    padding: 12px 16px;
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.35);
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    cursor: default;
  }

  #opacity-panel label {
    display: block;
    margin-bottom: 8px;
    white-space: nowrap;
  }

  #opacity-panel input[type="range"] {
    width: 180px;
    display: block;
  }

  /* Floating panel opened by right-clicking the box while it's on the
     red/gold (style-a) setting. Positioned at the cursor via JS. */
  #color-panel {
    position: fixed;
    z-index: 10;
    display: none;
    background: white;
    color: #222;
    padding: 12px 16px;
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.35);
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    cursor: default;
  }

  #color-panel .color-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #color-panel .color-row + .color-row {
    margin-top: 10px;
  }

  #color-panel label {
    width: 70px;
    flex-shrink: 0;
    white-space: nowrap;
  }

  #color-panel input[type="color"] {
    width: 28px;
    height: 28px;
    padding: 0;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    flex-shrink: 0;
  }

  #color-panel input[type="text"] {
    width: 90px;
    font-family: monospace;
    font-size: 0.85rem;
    padding: 4px 6px;
    border: 1px solid #ccc;
    border-radius: 4px;
    text-transform: uppercase;
  }

  /* Floating panel opened by middle-clicking the background (outside the
     box) — lets you adjust the background video's playback speed and
     mute/unmute it. Positioned at the cursor via JS. */
  #video-controls-panel {
    position: fixed;
    z-index: 10;
    display: none;
    background: white;
    color: #222;
    padding: 12px 16px;
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.35);
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    cursor: default;
  }

  #video-controls-panel label {
    display: block;
    margin-bottom: 8px;
    white-space: nowrap;
  }

  #video-controls-panel input[type="range"] {
    width: 180px;
    display: block;
  }

  #video-controls-panel button {
    margin-top: 10px;
    width: 100%;
    padding: 6px 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #f2f2f2;
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    cursor: pointer;
  }

  #video-controls-panel button:hover {
    background: #e6e6e6;
  }
</style>

<script>
  const wrapper = document.getElementById('countdown-wrapper');
  const overlay = document.getElementById('overlay');
  const headline = document.getElementById('headline');
  const countdown = document.getElementById('countdown');
  const bgVideo = document.getElementById('bg-video');
  const customBg = document.getElementById('custom-bg');
  const bgUploadInput = document.getElementById('bg-upload-input');
  const opacityPanel = document.getElementById('opacity-panel');
  const opacitySlider = document.getElementById('opacity-slider');
  const opacityValueLabel = document.getElementById('opacity-value');
  const opacityLabelText = document.getElementById('opacity-label-text');
  let currentTintOpacity = 0.3;
  let currentBoxOpacity = 1;
  let opacityTarget = 'style-b';
  let boxHidden = false;
  const colorPanel = document.getElementById('color-panel');
  const boxColorSwatch = document.getElementById('box-color-swatch');
  const boxColorHex = document.getElementById('box-color-hex');
  const textColorSwatch = document.getElementById('text-color-swatch');
  const textColorHex = document.getElementById('text-color-hex');
  let currentBoxColor = '#752C28';
  let currentTextColor = '#998156';
  let customBgObjectUrl = null;

  // Converts a "#rrggbb" hex colour into an "rgba(r, g, b, alpha)" string,
  // used to keep the countdown unit boxes tinted the same colour as a
  // custom box colour (just semi-transparent).
  function hexToRgba(hex, alpha) {
    const bigint = parseInt(hex.slice(1), 16);
    const r = (bigint >> 16) & 255;
    const g = (bigint >> 8) & 255;
    const b = bigint & 255;
    return 'rgba(' + r + ', ' + g + ', ' + b + ', ' + alpha + ')';
  }

  // True only for a well-formed "#rrggbb" (with or without a leading #).
  function isValidHex(value) {
    return /^#?[0-9a-fA-F]{6}$/.test(value);
  }

  function normalizeHex(value) {
    return value.startsWith('#') ? value : '#' + value;
  }

  function updateCountdown() {
    const now = new Date();
    const year = now.getFullYear();

    // Christmas Day spans from midnight to 23:59:59.999 on Dec 25
    const christmasStart = new Date(year, 11, 25, 0, 0, 0, 0);
    const christmasEnd = new Date(year, 11, 25, 23, 59, 59, 999);

    const isChristmasDay = now >= christmasStart && now <= christmasEnd;

    // Swap the headline text (same element, same font/styling either way).
    headline.textContent = isChristmasDay ? 'Merry Christmas!' : 'Christmas is coming...';

    // On Christmas Day, hide the countdown numbers completely (display: none)
    // so the box shrinks back to its original size around just the message,
    // and add the "christmas-day" class so the headline's margin collapses —
    // that leaves the box's own equal top/bottom padding centring the text.
    overlay.classList.toggle('christmas-day', isChristmasDay);
    countdown.style.display = isChristmasDay ? 'none' : 'flex';

    if (isChristmasDay) {
      return;
    }

    // Figure out which Christmas we're counting down to
    let christmas = christmasStart;
    if (now > christmasEnd) {
      christmas = new Date(year + 1, 11, 25, 0, 0, 0);
    }

    const diff = christmas - now;

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((diff / (1000 * 60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    document.getElementById('days').textContent = String(days).padStart(2, '0');
    document.getElementById('hours').textContent = String(hours).padStart(2, '0');
    document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
    document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);

  // Click anywhere on the overlay box to toggle between the two styles.
  // Does nothing while the box is hidden (see the middle-click handler
  // below) — the only way to interact with it while hidden is another
  // middle click, to bring it back.
  // stopPropagation keeps this click from also bubbling up to the
  // background click handler below (which would otherwise open the
  // file picker at the same time).
  overlay.addEventListener('click', (e) => {
    e.stopPropagation();
    if (boxHidden) {
      return;
    }
    closeOpacityPanel();
    closeColorPanel();
    overlay.classList.toggle('style-a');
    overlay.classList.toggle('style-b');
  });

  // Right click on the overlay box opens a small panel with a slider to
  // adjust that style's tint/box opacity live — the translucent style's
  // black tint (style-b), or the red/gold style's box colour (style-a).
  // Does nothing while the box is hidden.
  overlay.addEventListener('contextmenu', (e) => {
    if (boxHidden) {
      return;
    }
    if (overlay.classList.contains('style-b')) {
      e.preventDefault();
      e.stopPropagation();
      opacityTarget = 'style-b';
      openOpacityPanel(e.clientX, e.clientY, currentTintOpacity);
      return;
    }
    if (overlay.classList.contains('style-a')) {
      e.preventDefault();
      e.stopPropagation();
      opacityTarget = 'style-a';
      openOpacityPanel(e.clientX, e.clientY, currentBoxOpacity);
    }
  });

  // Middle click (mouse wheel button) on the overlay box:
  //  - while hidden (see below), brings it back and restores normal
  //    functionality, regardless of which style it was on.
  //  - while it's the translucent style (style-b), hides the entire box
  //    and its contents (opacity only, so this same middle click can
  //    find it again in the same spot to bring it back).
  //  - while it's the red/gold style (style-a), opens a panel with
  //    colour pickers (and hex code fields) for the box colour and the
  //    text colour, same as before.
  // Browsers fire 'auxclick' (not 'click') for middle-button clicks.
  overlay.addEventListener('auxclick', (e) => {
    if (e.button !== 1) {
      return;
    }
    e.preventDefault();
    e.stopPropagation();

    if (boxHidden) {
      boxHidden = false;
      overlay.classList.remove('box-hidden');
      return;
    }

    if (overlay.classList.contains('style-b')) {
      closeOpacityPanel();
      closeColorPanel();
      boxHidden = true;
      overlay.classList.add('box-hidden');
      return;
    }

    if (overlay.classList.contains('style-a')) {
      openColorPanel(e.clientX, e.clientY);
    }
  });

  // Middle-clicking normally triggers the browser's autoscroll/pan mode —
  // suppress that over the box, since middle click always does something
  // here now (hide/show on style-b, colour panel on style-a).
  overlay.addEventListener('mousedown', (e) => {
    if (e.button === 1) {
      e.preventDefault();
    }
  });

  function openOpacityPanel(x, y, initialValue) {
    opacityLabelText.textContent = 'Box transparency';
    opacitySlider.value = initialValue;
    opacityValueLabel.textContent = Math.round(initialValue * 100) + '%';
    opacityPanel.style.left = x + 'px';
    opacityPanel.style.top = y + 'px';
    opacityPanel.style.display = 'block';
  }

  function closeOpacityPanel() {
    opacityPanel.style.display = 'none';
  }

  // Live-update the relevant opacity as the slider is dragged — the
  // translucent tint's alpha for style-b, or the box colour's alpha for
  // style-a (combined with whatever hex colour is currently set).
  opacitySlider.addEventListener('input', () => {
    const value = parseFloat(opacitySlider.value);
    opacityValueLabel.textContent = Math.round(value * 100) + '%';
    if (opacityTarget === 'style-a') {
      currentBoxOpacity = value;
      updateBoxBackground();
    } else {
      currentTintOpacity = value;
      overlay.style.setProperty('--style-b-opacity', value);
    }
  });

  // Keep clicks inside either panel (e.g. dragging a slider, typing a hex
  // code) from closing it or triggering anything else on the page.
  opacityPanel.addEventListener('click', (e) => e.stopPropagation());
  opacityPanel.addEventListener('contextmenu', (e) => e.preventDefault());
  colorPanel.addEventListener('click', (e) => e.stopPropagation());
  colorPanel.addEventListener('contextmenu', (e) => e.preventDefault());

  function openColorPanel(x, y) {
    boxColorSwatch.value = currentBoxColor;
    boxColorHex.value = currentBoxColor.toUpperCase();
    textColorSwatch.value = currentTextColor;
    textColorHex.value = currentTextColor.toUpperCase();
    colorPanel.style.left = x + 'px';
    colorPanel.style.top = y + 'px';
    colorPanel.style.display = 'block';
  }

  function closeColorPanel() {
    colorPanel.style.display = 'none';
  }

  function applyBoxColor(hex) {
    currentBoxColor = hex;
    updateBoxBackground();
    overlay.style.setProperty('--style-a-unit-bg', hexToRgba(hex, 0.65));
  }

  // Combines the current box colour and current box opacity into one
  // rgba() and applies it. Called whenever either one changes (from the
  // colour panel's swatch/hex fields, or from the opacity slider).
  function updateBoxBackground() {
    overlay.style.setProperty('--style-a-bg', hexToRgba(currentBoxColor, currentBoxOpacity));
  }

  function applyTextColor(hex) {
    currentTextColor = hex;
    overlay.style.setProperty('--style-a-color', hex);
  }

  // Box colour swatch (native picker) — updates live as it's dragged, and
  // keeps the hex field in sync.
  boxColorSwatch.addEventListener('input', () => {
    boxColorHex.value = boxColorSwatch.value.toUpperCase();
    applyBoxColor(boxColorSwatch.value);
  });

  // Box colour hex field — applies live once it's a valid 6-digit hex
  // code, and keeps the swatch in sync.
  boxColorHex.addEventListener('input', () => {
    if (!isValidHex(boxColorHex.value)) {
      return;
    }
    const hex = normalizeHex(boxColorHex.value);
    boxColorSwatch.value = hex;
    applyBoxColor(hex);
  });

  // Text colour swatch and hex field — same pattern as the box colour.
  textColorSwatch.addEventListener('input', () => {
    textColorHex.value = textColorSwatch.value.toUpperCase();
    applyTextColor(textColorSwatch.value);
  });

  textColorHex.addEventListener('input', () => {
    if (!isValidHex(textColorHex.value)) {
      return;
    }
    const hex = normalizeHex(textColorHex.value);
    textColorSwatch.value = hex;
    applyTextColor(hex);
  });

  // Clicking anywhere else on the page closes whichever panel is open.
  document.addEventListener('click', (e) => {
    if (!opacityPanel.contains(e.target)) {
      closeOpacityPanel();
    }
    if (!colorPanel.contains(e.target)) {
      closeColorPanel();
    }
    if (!videoControlsPanel.contains(e.target)) {
      closeVideoControlsPanel();
    }
  });

  // Set by the right-click handler below whenever it opens the file
  // picker, so a click that follows it (e.g. a phantom 'click' event some
  // browsers fire once the file dialog closes and focus returns to the
  // page) doesn't also trigger fullscreen.
  let suppressNextBackgroundClick = false;

  // Left click anywhere on the background (i.e. anywhere outside the
  // overlay box) toggles fullscreen for the page.
  wrapper.addEventListener('click', (e) => {
    if (suppressNextBackgroundClick) {
      suppressNextBackgroundClick = false;
      return;
    }
    if (e.button !== 0) {
      return;
    }
    if (overlay.contains(e.target)) {
      return;
    }
    toggleFullscreen();
  });

  // Cross-browser helpers for the Fullscreen API (Safari still needs the
  // webkit-prefixed versions).
  function isFullscreenActive() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
  }

  function toggleFullscreen() {
    try {
      let result;
      if (!isFullscreenActive()) {
        const el = document.documentElement;
        result = el.requestFullscreen ? el.requestFullscreen()
          : el.webkitRequestFullscreen ? el.webkitRequestFullscreen()
          : el.msRequestFullscreen ? el.msRequestFullscreen()
          : null;
      } else {
        result = document.exitFullscreen ? document.exitFullscreen()
          : document.webkitExitFullscreen ? document.webkitExitFullscreen()
          : document.msExitFullscreen ? document.msExitFullscreen()
          : null;
      }
      // requestFullscreen()/exitFullscreen() return a Promise in modern
      // browsers, but not in older prefixed implementations — only call
      // .catch() if one was actually returned.
      if (result && typeof result.catch === 'function') {
        result.catch(() => {});
      }
    } catch (err) {
      // Fullscreen API unavailable or blocked (e.g. inside an iframe
      // without the "allowfullscreen"/"allow=fullscreen" attribute) —
      // fail silently rather than breaking the rest of the page.
    }
  }

  // Right click anywhere on the background (i.e. anywhere outside the
  // overlay box) to upload a custom image, gif, or video to use as the
  // background instead of the built-in video.
  wrapper.addEventListener('contextmenu', (e) => {
    if (overlay.contains(e.target)) {
      return;
    }
    e.preventDefault();
    suppressNextBackgroundClick = true;
    bgUploadInput.click();
  });

  // Middle click (mouse wheel button) anywhere on the background opens a
  // panel to control the background video: playback speed, and
  // mute/unmute. Only does anything if the current background is
  // actually a video (built-in, or a custom uploaded one) — a still
  // image/gif background has nothing to control. Browsers fire
  // 'auxclick' (not 'click') for middle-button clicks.
  const videoControlsPanel = document.getElementById('video-controls-panel');
  const videoSpeedSlider = document.getElementById('video-speed-slider');
  const videoSpeedValue = document.getElementById('video-speed-value');
  const videoMuteToggle = document.getElementById('video-mute-toggle');

  function getActiveBackgroundVideo() {
    // If a custom background is currently showing, control it if it's a
    // video; if it's an image/gif there's nothing to control.
    if (customBg.style.display === 'block') {
      return customBg.querySelector('video');
    }
    return bgVideo;
  }

  function openVideoControlsPanel(x, y) {
    const video = getActiveBackgroundVideo();
    if (!video) {
      return;
    }
    videoSpeedSlider.value = video.playbackRate || 1;
    videoSpeedValue.textContent = (video.playbackRate || 1) + 'x';
    videoMuteToggle.textContent = video.muted ? 'Unmute' : 'Mute';
    videoControlsPanel.style.left = x + 'px';
    videoControlsPanel.style.top = y + 'px';
    videoControlsPanel.style.display = 'block';
  }

  function closeVideoControlsPanel() {
    videoControlsPanel.style.display = 'none';
  }

  videoSpeedSlider.addEventListener('input', () => {
    const video = getActiveBackgroundVideo();
    if (!video) {
      return;
    }
    const rate = parseFloat(videoSpeedSlider.value);
    video.playbackRate = rate;
    videoSpeedValue.textContent = rate + 'x';
  });

  videoMuteToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    const video = getActiveBackgroundVideo();
    if (!video) {
      return;
    }
    video.muted = !video.muted;
    videoMuteToggle.textContent = video.muted ? 'Unmute' : 'Mute';
  });

  // Keep clicks inside the panel (dragging the slider, clicking the mute
  // button) from closing it or triggering anything else on the page.
  videoControlsPanel.addEventListener('click', (e) => e.stopPropagation());
  videoControlsPanel.addEventListener('contextmenu', (e) => e.preventDefault());

  wrapper.addEventListener('auxclick', (e) => {
    if (e.button !== 1) {
      return;
    }
    if (overlay.contains(e.target)) {
      return;
    }
    e.preventDefault();
    openVideoControlsPanel(e.clientX, e.clientY);
  });

  // Middle-clicking normally triggers the browser's autoscroll/pan mode —
  // suppress that over the background too, since middle click opens the
  // video controls panel there now.
  wrapper.addEventListener('mousedown', (e) => {
    if (e.button === 1 && !overlay.contains(e.target)) {
      e.preventDefault();
    }
  });

  bgUploadInput.addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) {
      return;
    }

    // Free up the previous custom background (if any) before swapping in
    // the new one.
    if (customBgObjectUrl) {
      URL.revokeObjectURL(customBgObjectUrl);
    }
    customBgObjectUrl = URL.createObjectURL(file);

    customBg.innerHTML = '';

    // If the file can't actually be decoded/played (e.g. some .mov files
    // exported from an iPhone use the HEVC/H.265 codec, which many
    // non-Safari browsers can't play), fall back to the built-in video
    // instead of silently leaving a black or blank background.
    const revertToBuiltInVideo = () => {
      customBg.style.display = 'none';
      customBg.innerHTML = '';
      bgVideo.style.display = 'block';
      bgVideo.play().catch(() => {});
      alert(
        "Sorry, your browser couldn't play that file (" + file.name + "). " +
        "This can happen with .mov files recorded on an iPhone, which often " +
        "use a codec (HEVC) that isn't supported outside Safari. " +
        "Try exporting/converting it to .mp4 (H.264), or use a different file."
      );
    };

    let mediaEl;
    const isVideo = file.type.startsWith('video/') ||
      /\.(mov|mp4|m4v|webm|ogv)$/i.test(file.name);

    if (isVideo) {
      mediaEl = document.createElement('video');
      mediaEl.autoplay = true;
      mediaEl.muted = true;
      mediaEl.loop = true;
      mediaEl.playsInline = true;
      mediaEl.addEventListener('error', revertToBuiltInVideo);
      // Some unsupported files load some metadata but then never actually
      // produce a frame — catch that case too via the play() rejection.
      mediaEl.addEventListener('loadedmetadata', () => {
        mediaEl.play().catch(revertToBuiltInVideo);
      });
    } else {
      // Covers both static images and animated gifs.
      mediaEl = document.createElement('img');
      mediaEl.alt = 'Custom background';
      mediaEl.addEventListener('error', revertToBuiltInVideo);
    }
    mediaEl.src = customBgObjectUrl;

    customBg.appendChild(mediaEl);
    customBg.style.display = 'block';

    // Hide (and pause) the built-in video while the custom background is
    // showing. Nothing here is saved anywhere, so reloading the page
    // always starts fresh with the built-in video again.
    bgVideo.style.display = 'none';
    bgVideo.pause();

    // Reset the input so choosing the same file again still fires 'change'.
    bgUploadInput.value = '';
  });

  // Hide the mouse cursor after 1 second of inactivity, and bring it back
  // the moment the mouse moves (or is clicked) again.
  let cursorIdleTimer;
  function showCursor() {
    document.documentElement.classList.remove('cursor-hidden');
    clearTimeout(cursorIdleTimer);
    cursorIdleTimer = setTimeout(() => {
      document.documentElement.classList.add('cursor-hidden');
    }, 1000);
  }
  document.addEventListener('mousemove', showCursor);
  document.addEventListener('mousedown', showCursor);
  showCursor();
</script>
